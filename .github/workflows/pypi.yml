# PyPI Trusted Publisher 发布流水线。
#
# 前提（一次性，在 PyPI 网站上配置）：把本仓库登记为 repowiki 项目的
# Trusted Publisher —— 项目尚未上传过 PyPI 时用「Pending Publisher」预登记：
#   https://pypi.org/manage/account/publishing/ → Add a new pending project publisher
#     PyPI project name: repowiki-cli
#     Owner:             luomsis
#     Repository:        repowiki
#     Workflow filename: pypi.yml   （必须与本文件名完全一致）
#     Environment:       pypi       （与下方 job 的 environment 一致；留空则两边都留空）
# 已手动上传过首版的项目则在项目页 Settings → Publishing 添加同样的条目。
#
# 触发：GitHub Release 发布时自动上传；或在 Actions 页面手动 dispatch。
# 无需任何 API token：身份由 GitHub OIDC（id-token: write）证明。

name: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
