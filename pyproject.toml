[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repowiki"
version = "0.4.0"
description = "Deterministic repo wiki build system, driven by any coding agent. Output language follows the repository (zh/en)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "luomsis" }]
keywords = ["documentation", "wiki", "codebase", "mermaid", "llm", "agent", "onboarding", "developer-tools"]
dependencies = ["pyyaml>=6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Documentation",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/luomsis/repowiki"
Repository = "https://github.com/luomsis/repowiki"
Issues = "https://github.com/luomsis/repowiki/issues"
Changelog = "https://github.com/luomsis/repowiki/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
repowiki = "repowiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repowiki = ["templates/*/*", "templates/site.html", "templates/site/*", "vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
