<!doctype html>

<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Wiki</title>
<style>
/* ---------------------------------------------------------------------------
   design tokens
--------------------------------------------------------------------------- */
:root {
  /* color · light */
  --bg: #ffffff; --fg: #1f2328; --muted: #59636e;
  --border: #d8dee4; --border-soft: #eaeef2;
  --accent: #0969da; --accent-soft: rgba(9, 105, 218, .08);
  --sidebar-bg: #f7f9fb; --code-bg: #f6f8fa; --pre-bg: #fcfdff;
  --row-alt: #f8fafc; --mark: #fff3b8; --hit-bg: #eef3fa;
  /* type */
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  /* shape & elevation */
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
  --shadow-1: 0 1px 2px rgba(140, 152, 164, .12);
  --shadow-2: 0 12px 32px rgba(140, 152, 164, .28);
  /* layout */
  --topbar-h: 52px; --sidebar-w: 300px; --content-max: 880px;
}
[data-theme="dark"] {
  --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0;
  --border: #30363d; --border-soft: #21262d;
  --accent: #4493f8; --accent-soft: rgba(68, 147, 248, .13);
  --sidebar-bg: #0a0e14; --code-bg: #161b22; --pre-bg: #131922;
  --row-alt: #10161d; --mark: #bb800955; --hit-bg: #1c2a3d;
  --shadow-1: 0 1px 2px rgba(1, 4, 9, .4);
  --shadow-2: 0 12px 32px rgba(1, 4, 9, .65);
}

/* ---------------------------------------------------------------------------
   base
--------------------------------------------------------------------------- */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15.5px/1.75 var(--font-sans);
  transition: background .2s ease, color .2s ease;
}
button { font: inherit; color: inherit; }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
*::-webkit-scrollbar-track { background: transparent; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ---------------------------------------------------------------------------
   topbar
--------------------------------------------------------------------------- */
#topbar {
  position: fixed; inset: 0 0 auto 0; height: var(--topbar-h); z-index: 30;
  display: flex; align-items: center; gap: 10px; padding: 0 14px;
  background: color-mix(in srgb, var(--sidebar-bg) 86%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--border);
}
@supports not (backdrop-filter: blur(1px)) { #topbar { background: var(--sidebar-bg); } }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); background: var(--bg);
  border-radius: var(--radius-sm); width: 34px; height: 34px; cursor: pointer; flex: none;
  color: var(--muted); transition: color .15s ease, border-color .15s ease;
}
.icon-btn:hover { color: var(--accent); border-color: var(--accent); }
.site-title { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb-sep { color: var(--border); flex: none; }
.crumb-page {
  color: var(--muted); font-size: .92em; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
#progress {
  position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%;
  transform-origin: 0 50%; transform: scaleX(0); background: var(--accent);
  pointer-events: none;
}
#search-wrap { position: relative; flex: 1 1 auto; max-width: 420px; margin-left: auto; }
#search {
  width: 100%; height: 34px; padding: 0 12px; font: inherit; font-size: 14px; color: var(--fg);
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
  transition: border-color .15s ease, box-shadow .15s ease;
}
#search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#search-results {
  position: absolute; top: 40px; left: 0; right: 0; max-height: 60vh; overflow: auto;
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md);
  box-shadow: var(--shadow-2); padding: 5px; z-index: 40;
}
.search-hit { display: block; padding: 7px 9px; border-radius: var(--radius-sm); text-decoration: none; color: var(--fg); }
.search-hit:hover { background: var(--hit-bg); }
.search-hit b { display: block; color: var(--accent); font-weight: 600; }
.search-hit span { display: block; font-size: 12px; color: var(--muted); line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-hit mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.search-none { display: block; padding: 8px; color: var(--muted); }

/* ---------------------------------------------------------------------------
   sidebar
--------------------------------------------------------------------------- */
#sidebar {
  position: fixed; top: var(--topbar-h); bottom: 0; left: 0; width: var(--sidebar-w); z-index: 20;
  display: flex; flex-direction: column;
  background: var(--sidebar-bg); border-right: 1px solid var(--border);
}
#backdrop { display: none; position: fixed; inset: var(--topbar-h) 0 0 0; background: rgba(0,0,0,.45); z-index: 15; }
#nav-tree { flex: 1 1 58%; min-height: 0; overflow-y: auto; padding: 10px 8px 16px; }
.nav-chapter {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  width: calc(100% - 8px); margin: 14px 4px 4px; padding: 4px 8px;
  border: none; background: none; cursor: pointer; text-align: left;
  font-size: 12px; font-weight: 650; letter-spacing: .05em;
  color: var(--muted); text-transform: uppercase; border-radius: var(--radius-sm);
}
.nav-chapter:hover { color: var(--fg); }
.nav-chapter .chev { flex: none; transition: transform .15s ease; }
.nav-chapter[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.nav-children[hidden] { display: none; }
#nav-tree a {
  display: block; padding: 5px 10px; border-radius: var(--radius-sm); text-decoration: none;
  color: var(--fg); cursor: pointer; line-height: 1.45; font-size: 13.5px;
  border-left: 2px solid transparent;
}
#nav-tree a:hover { background: var(--hit-bg); }
#nav-tree a.active {
  background: var(--accent-soft); color: var(--accent); font-weight: 600;
  border-left-color: var(--accent); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}
/* on-this-page toc */
#toc-wrap { flex: 1 1 42%; min-height: 0; overflow-y: auto; padding: 6px 8px 20px; border-top: 1px solid var(--border-soft); }
#toc-wrap[hidden] { display: none; }
.toc-label {
  margin: 8px 8px 6px; font-size: 11px; font-weight: 650; letter-spacing: .08em;
  color: var(--muted); text-transform: uppercase;
}
#page-toc a {
  display: block; padding: 3px 10px; font-size: 12.5px; line-height: 1.5;
  color: var(--muted); text-decoration: none; border-left: 2px solid transparent;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis;
}
#page-toc a.l3 { padding-left: 24px; }
#page-toc a:hover { color: var(--fg); }
#page-toc a.active {
  color: var(--accent); border-left-color: var(--accent); font-weight: 600;
  background: var(--accent-soft);
}

/* ---------------------------------------------------------------------------
   main content
--------------------------------------------------------------------------- */
#main { margin: var(--topbar-h) 0 0 var(--sidebar-w); }
#content { max-width: var(--content-max); margin: 0 auto; padding: 36px 48px 40px; }
#content h1, #content h2, #content h3, #content h4, #content h5, #content h6 {
  line-height: 1.35; margin: 1.5em 0 .6em; text-wrap: balance; scroll-margin-top: calc(var(--topbar-h) + 16px);
}
#content h1 {
  font-size: 1.85em; font-weight: 700; letter-spacing: -.01em;
  margin-top: .1em; padding-bottom: .35em; border-bottom: 1px solid var(--border);
}
#content h2 { font-size: 1.4em; font-weight: 650; padding-bottom: .3em; border-bottom: 1px solid var(--border-soft); }
#content h3 { font-size: 1.18em; font-weight: 650; }
#content h4 { font-size: 1.02em; font-weight: 650; color: var(--fg); }
#content h5, #content h6 { font-size: .95em; font-weight: 650; color: var(--muted); }
#content p { margin: .85em 0; }
#content li + li { margin-top: .3em; }
#content a { color: var(--accent); text-decoration: none; }
#content a:hover { text-decoration: underline; text-underline-offset: 3px; }
#content a[href^="file://"] { border-bottom: 1px dashed var(--border); }
#content a[href^="file://"]:hover { border-bottom-color: var(--accent); text-decoration: none; }
#content hr { border: none; border-top: 1px solid var(--border-soft); margin: 2em 0; }
#content code {
  font-family: var(--font-mono); font-size: .875em; background: var(--code-bg);
  border: 1px solid var(--border-soft); padding: .1em .4em; border-radius: 5px;
}
#content pre {
  background: var(--pre-bg); border: 1px solid var(--border-soft);
  padding: 14px 16px; overflow-x: auto; font-size: .875em; line-height: 1.6;
}
#content pre code { background: none; border: none; padding: 0; font-size: 1em; }
/* code block with header bar */
.codeblock {
  margin: 1.2em 0; border: 1px solid var(--border-soft); border-radius: var(--radius-md);
  overflow: hidden; background: var(--pre-bg); box-shadow: var(--shadow-1);
}
.codeblock-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 5px 8px 5px 14px; background: var(--code-bg); border-bottom: 1px solid var(--border-soft);
}
.codeblock-lang {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .07em;
  text-transform: uppercase; color: var(--muted);
}
.copy-btn {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px;
  border: none; background: none; border-radius: var(--radius-sm); cursor: pointer;
  font-size: 12px; color: var(--muted); transition: color .15s ease, background .15s ease;
}
.copy-btn:hover { color: var(--accent); background: var(--accent-soft); }
.codeblock pre { margin: 0; border: none; border-radius: 0; background: transparent; box-shadow: none; }
/* quotes & references */
#content blockquote {
  display: block; margin: 1.1em 0; padding: 2px 16px; color: var(--muted);
  border-left: 3px solid var(--border); font-style: normal;
}
#content cite {
  display: block; margin: 1.3em 0; padding: 12px 18px; font-style: normal; font-size: .93em;
  color: var(--muted); background: var(--code-bg);
  border: 1px solid var(--border-soft); border-left: 3px solid var(--accent);
  border-radius: var(--radius-md);
}
#content cite p { margin: .3em 0; }
#content cite ul { margin: .5em 0; padding-left: 1.2em; }
#content cite li { margin: .25em 0; }
/* tables */
#content table { border-collapse: collapse; margin: 1.2em 0; display: block; overflow-x: auto; max-width: 100%; font-size: .93em; }
#content th, #content td { border: 1px solid var(--border); padding: 7px 13px; }
#content th { background: var(--code-bg); font-weight: 650; white-space: nowrap; }
#content tbody tr:nth-child(even) { background: var(--row-alt); }
#content tbody tr:hover { background: var(--hit-bg); }
#content img { max-width: 100%; }
/* mermaid */
.rw-mermaid {
  margin: 1.3em 0; text-align: center; padding: 20px 16px;
  background: var(--pre-bg); border: 1px solid var(--border-soft);
  border-radius: var(--radius-md); box-shadow: var(--shadow-1);
}
.rw-mermaid svg { max-width: 100%; height: auto; }
.rw-mermaid-error { color: var(--muted); }
.rw-mermaid-error pre { margin: .4em 0; }

/* ---------------------------------------------------------------------------
   pager & footer
--------------------------------------------------------------------------- */
#pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: var(--content-max); margin: 0 auto; padding: 8px 48px 72px; }
#pager[hidden] { display: none; }
#pager a {
  display: block; padding: 13px 18px; border: 1px solid var(--border);
  border-radius: var(--radius-md); text-decoration: none; color: var(--fg); background: var(--bg);
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
#pager a:hover { border-color: var(--accent); box-shadow: var(--shadow-1); transform: translateY(-1px); text-decoration: none; }
#pager .dir { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
#pager a:hover .dir { color: var(--accent); }
#pager .next { text-align: right; }
#site-footer {
  max-width: var(--content-max); margin: 0 auto; padding: 0 48px 48px;
  color: var(--muted); font-size: 12.5px;
}

/* ---------------------------------------------------------------------------
   snippet modal
--------------------------------------------------------------------------- */
#modal {
  position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55);
  display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px;
}
#modal[hidden] { display: none; }
#modal-card {
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg);
  width: 100%; max-width: 860px; max-height: 84vh; display: flex; flex-direction: column;
  box-shadow: var(--shadow-2);
}
#modal-card header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 13px;
}
#modal-body { overflow: auto; padding: 8px 0 12px; }
.rw-missing { color: var(--muted); padding: 8px 14px; }
.rw-code { border-collapse: collapse; width: 100%; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; }
.rw-code td { padding: 0 10px; vertical-align: top; }
.rw-ln {
  text-align: right; color: var(--muted); user-select: none; width: 1%;
  white-space: nowrap; border-right: 1px solid var(--border-soft);
}
.rw-code pre { margin: 0; padding: 1px 0; background: none; border: none; white-space: pre-wrap; word-break: break-all; }

/* ---------------------------------------------------------------------------
   narrow screens
--------------------------------------------------------------------------- */
@media (max-width: 900px) {
  #sidebar { transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow-2); }
  body.sidebar-open #sidebar { transform: none; }
  body.sidebar-open #backdrop { display: block; }
  #main { margin-left: 0; }
  #content { padding: 24px 22px 32px; }
  #pager { padding: 8px 22px 56px; }
  #site-footer { padding: 0 22px 40px; }
}
@media (max-width: 600px) {
  .crumb-sep, .crumb-page { display: none; }
  #content h1 { font-size: 1.55em; }
  #pager { grid-template-columns: 1fr; }
  #pager .next { text-align: left; }
}
@media print {
  #topbar, #sidebar, #backdrop, #pager, #site-footer { display: none; }
  #main { margin: 0; }
  #content { max-width: none; }
}
</style>
</head>

  <button id="menu-btn" class="icon-btn" title="目录" aria-label="目录"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
