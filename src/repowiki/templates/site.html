<!doctype html>
<!-- Generated by `repowiki site` — fully offline, safe to share or re-open anywhere. -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki</title>
<style>
:root {
  --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0;
  --accent: #0969da; --sidebar-bg: #f6f8fa; --code-bg: #f6f8fa;
  --pre-bg: #f6f8fa; --mark: #fff8c5; --hit-bg: #eef3fa;
}
[data-theme="dark"] {
  --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --border: #3d444d;
  --accent: #4493f8; --sidebar-bg: #151b23; --code-bg: #151b23;
  --pre-bg: #151b23; --mark: #bb800933; --hit-bg: #1c2a3d;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif;
}
button { font: inherit; color: inherit; }

/* --- topbar --- */
#topbar {
  position: fixed; inset: 0 0 auto 0; height: 48px; z-index: 30;
  display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: var(--sidebar-bg); border-bottom: 1px solid var(--border);
}
.icon-btn {
  border: 1px solid var(--border); background: var(--bg); border-radius: 6px;
  width: 32px; height: 32px; cursor: pointer; flex: none;
}
.icon-btn:hover { border-color: var(--accent); }
#search-wrap { position: relative; flex: 1; max-width: 420px; }
#search {
  width: 100%; height: 32px; padding: 0 10px; font: inherit; color: var(--fg);
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
}
#search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#search-results {
  position: absolute; top: 38px; left: 0; right: 0; max-height: 60vh; overflow: auto;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.15); padding: 4px; z-index: 40;
}
.search-hit { display: block; padding: 6px 8px; border-radius: 6px; text-decoration: none; color: var(--fg); }
.search-hit:hover { background: var(--hit-bg); }
.search-hit b { display: block; color: var(--accent); font-weight: 600; }
.search-hit span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-none { display: block; padding: 8px; color: var(--muted); }
.site-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* --- sidebar --- */
#sidebar {
  position: fixed; top: 48px; bottom: 0; left: 0; width: 288px; z-index: 20;
  overflow-y: auto; padding: 12px 8px 24px;
  background: var(--sidebar-bg); border-right: 1px solid var(--border);
}
#backdrop { display: none; position: fixed; inset: 48px 0 0 0; background: rgba(0,0,0,.4); z-index: 15; }
.nav-chapter {
  margin: 14px 8px 4px; font-size: 12px; font-weight: 600; letter-spacing: .04em;
  color: var(--muted); text-transform: uppercase;
}
#nav-tree a {
  display: block; padding: 5px 10px; border-radius: 6px; text-decoration: none;
  color: var(--fg); cursor: pointer; line-height: 1.4;
}
#nav-tree a:hover { background: var(--hit-bg); }
#nav-tree a.active { background: var(--hit-bg); color: var(--accent); font-weight: 600; }

/* --- main --- */
#main { margin: 48px 0 0 288px; }
#content { max-width: 880px; margin: 0 auto; padding: 28px 40px 96px; }
#content h1, #content h2, #content h3, #content h4 { line-height: 1.3; margin: 1.4em 0 .6em; }
#content h1 { font-size: 1.9em; margin-top: .2em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
#content h2 { font-size: 1.45em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
#content a { color: var(--accent); }
#content code {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: .9em; background: var(--code-bg); padding: .15em .4em; border-radius: 5px;
}
#content pre {
  background: var(--pre-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 14px; overflow-x: auto;
}
#content pre code { background: none; padding: 0; font-size: .88em; }
#content blockquote, #content cite {
  display: block; margin: 1em 0; padding: 2px 14px; color: var(--muted);
  border-left: 3px solid var(--border); font-style: normal;
}
#content table { border-collapse: collapse; margin: 1em 0; display: block; overflow-x: auto; max-width: 100%; }
#content th, #content td { border: 1px solid var(--border); padding: 5px 12px; }
#content th { background: var(--sidebar-bg); }
#content img { max-width: 100%; }
.rw-mermaid { margin: 1.2em 0; text-align: center; }
.rw-mermaid svg { max-width: 100%; height: auto; }
.rw-mermaid-error pre { color: var(--muted); }

/* --- snippet modal --- */
#modal {
  position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.5);
  display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px;
}
#modal[hidden] { display: none; }
#modal-card {
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  width: 100%; max-width: 860px; max-height: 84vh; display: flex; flex-direction: column;
  box-shadow: 0 16px 48px rgba(0,0,0,.3);
}
#modal-card header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px;
}
#modal-body { overflow: auto; padding: 8px 0 12px; }
.rw-missing { color: var(--muted); padding: 8px 14px; }
.rw-code { border-collapse: collapse; width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
.rw-code td { padding: 0 10px; vertical-align: top; }
.rw-ln {
  text-align: right; color: var(--muted); user-select: none; width: 1%;
  white-space: nowrap; border-right: 1px solid var(--border);
}
.rw-code pre { margin: 0; padding: 1px 0; background: none; border: none; white-space: pre-wrap; word-break: break-all; }

/* --- narrow screens --- */
@media (max-width: 900px) {
  #sidebar { transform: translateX(-100%); transition: transform .2s ease; }
  body.sidebar-open #sidebar { transform: none; }
  body.sidebar-open #backdrop { display: block; }
  #main { margin-left: 0; }
  #content { padding: 20px 18px 80px; }
}
@media print {
  #topbar, #sidebar, #backdrop { display: none; }
  #main { margin: 0; }
}
</style>
</head>
<body>
<header id="topbar">
  <button id="menu-btn" class="icon-btn" title="目录" aria-label="目录">☰</button>
  <span class="site-title" id="site-title"></span>
  <div id="search-wrap">
    <input id="search" type="search" autocomplete="off" placeholder="搜索…">
    <div id="search-results" hidden></div>
  </div>
  <button id="theme-btn" class="icon-btn" title="主题" aria-label="主题">◐</button>
</header>
<nav id="sidebar" aria-label="目录"><div id="nav-tree"></div></nav>
<div id="backdrop"></div>
<main id="main"><article id="content" class="md-body"></article></main>
<div id="modal" hidden>
  <div id="modal-card" role="dialog" aria-modal="true">
    <header><span id="modal-title"></span><button id="modal-close" class="icon-btn">✕</button></header>
    <div id="modal-body"></div>
  </div>
</div>
<noscript>本页面需要启用 JavaScript 渲染（内容已全部内嵌，无需网络）。/ JavaScript is required (content is fully embedded; no network needed).</noscript>
<script>window.SITE_DATA = {{SITE_PAYLOAD}};</script>
<script>{{MARKED_JS}}</script>
<script>{{MERMAID_JS}}</script>
<script>{{APP_JS}}</script>
</body>
</html>
